[package]
name = "mceliece_rs"
version = "0.2.0"
edition = "2024"
authors = ["batt0s <me@battos.dev>"]
description = "A Rust implementation of the Classic McEliece cryptosystem"

[features]
default = []
mceliece348864 = []
mceliece348864f = []
mceliece460896 = []
mceliece460896f = []
mceliece6688128 = []
mceliece6688128f = []
mceliece6960119 = []
mceliece6960119f = []
mceliece8192128 = []
mceliece8192128f = []

[dependencies]
rand = "0.8"
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
subtle = "2.5"

[dev-dependencies]
dudect-bencher = "0.5.0"
rand = "0.8"
clap = "2"
hex = "0.4"
aes = "0.8"
